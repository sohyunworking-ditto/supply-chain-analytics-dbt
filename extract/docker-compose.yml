# WWI .bak 복원과 Parquet 추출에만 쓰는 1회용 SQL Server.
# Apple Silicon: Docker Desktop → Settings → General → "Use Rosetta for x86_64/amd64 emulation" 켜기
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: wwi-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?extract/.env에 MSSQL_SA_PASSWORD를 설정하세요}
    ports:
      - "1433:1433"
    volumes:
      - ./backup:/var/opt/mssql/backup:ro
      - ./restore.sql:/scripts/restore.sql:ro
      - ./checks.sql:/scripts/checks.sql:ro
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mssql_data:
